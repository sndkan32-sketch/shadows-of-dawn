name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64 + SDL2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2

      - name: Build shadows.exe
        run: |
          mkdir dist
          if g++ -std=c++17 -O2 main.cpp -o dist/shadows.exe -static $(sdl2-config --cflags --static-libs); then
            echo "Static build OK: single shadows.exe, no DLL needed"
          else
            echo "Static build failed, falling back to dynamic build with SDL2.dll"
            g++ -std=c++17 -O2 main.cpp -o dist/shadows.exe $(sdl2-config --cflags --libs)
            cp "$(dirname "$(which g++)")/SDL2.dll" dist/
          fi
          ls -l dist

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: shadows-windows
          path: dist/
          retention-days: 90
